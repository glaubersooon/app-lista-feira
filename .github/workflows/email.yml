name: E-mail da lista de compras

# Segunda e quinta às 7h de Brasília (10h UTC). O cron sai 3 min antes porque o GitHub atrasa um pouco.
# Segunda = lista Sr. Jorge, quinta = lista Feira.
on:
  schedule:
    - cron: '57 9 * * 1'
    - cron: '57 9 * * 4'
  workflow_dispatch:
    inputs:
      dia:
        description: 'Qual e-mail enviar'
        type: choice
        options: [segunda, quinta]
        default: quinta
      teste:
        description: 'Mandar para o e-mail de teste (o seu), não para a sogra'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Derrubar todos os usuários (só no envio de verdade, pra sogra abrir sozinha)
        if: ${{ github.event_name == 'schedule' || inputs.teste == false }}
        env:
          CODIGO: ${{ secrets.CODIGO_ACESSO }}
        run: |
          if [ -z "$CODIGO" ]; then echo "Sem código de acesso nos segredos. Pulando."; exit 0; fi
          AGORA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COD=$(curl -sS -o resposta-derrubar.txt -w '%{http_code}' \
            -X PATCH "https://firestore.googleapis.com/v1/projects/app-lista-feira/databases/(default)/documents/acesso/${CODIGO}/estado/sessao" \
            -H 'Content-Type: application/json' \
            -d "{\"fields\":{\"em\":{\"timestampValue\":\"${AGORA}\"},\"por\":{\"stringValue\":\"auto-email\"}}}")
          echo "Resposta do Firestore ($COD): $(cat resposta-derrubar.txt)"
          # Não falha o job por causa disso: o e-mail é mais importante que o derrubar.
          [ "$COD" = "200" ] || echo "Aviso: não deu pra derrubar os usuários antes de enviar (não bloqueia o e-mail)."
      - name: Enviar e-mail
        env:
          PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          CODIGO: ${{ secrets.CODIGO_ACESSO }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_TESTE: ${{ secrets.EMAIL_TESTE }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          TESTE: ${{ inputs.teste }}
          DIA: ${{ inputs.dia }}
        run: |
          if [ -z "$DIA" ]; then
            if [ "$(TZ=America/Sao_Paulo date +%u)" = "1" ]; then DIA=segunda; else DIA=quinta; fi
          fi
          if [ "$DIA" = "segunda" ]; then ASSUNTO="Lista Sr. Jorge"; DIA_SEMANA="Segunda-feira"; else ASSUNTO="Lista Feira"; DIA_SEMANA="Quinta-feira"; fi
          DATA="${DIA_SEMANA}, $(TZ=America/Sao_Paulo date '+%d/%m')"
          LINK_REAL="https://glaubersooon.github.io/app-lista-feira/#c=${CODIGO}"
          # O link de teste (&teste=1) funciona igual, mas não salva nada nem mexe na lista de verdade.
          LINK_TESTE="${LINK_REAL}&teste=1"

          # Manda um e-mail pelo EmailJS. Devolve 0 se deu certo.
          enviar() { # $1=para $2=assunto $3=data $4=link
            jq -n --arg u "$PUBLIC_KEY" --arg k "$PRIVATE_KEY" --arg para "$1" --arg assunto "$2" --arg data "$3" --arg link "$4" \
              '{service_id:"service_0xqf97q",template_id:"template_bbidvdd",user_id:$u,accessToken:$k,template_params:{para:$para,assunto:$assunto,data:$data,link:$link}}' > corpo.json
            local cod
            cod=$(curl -sS -o resposta.txt -w '%{http_code}' -X POST https://api.emailjs.com/api/v1.0/email/send \
              -H 'Content-Type: application/json' -d @corpo.json)
            rm -f corpo.json
            echo "Resposta do EmailJS ($cod) para $1: $(cat resposta.txt)"
            [ "$cod" = "200" ]
          }

          if [ "$MANUAL" = "true" ] && [ "$TESTE" = "true" ]; then
            # Teste manual: só para você.
            [ -n "$EMAIL_TESTE" ] || { echo "Sem EMAIL_TESTE nos segredos."; exit 1; }
            enviar "$EMAIL_TESTE" "$ASSUNTO" "$DATA" "$LINK_TESTE" || { echo "O envio falhou."; exit 1; }
            echo "E-mail de teste \"$ASSUNTO\" enviado."
            exit 0
          fi

          # Envio de verdade: Regina primeiro, depois uma cópia de aviso para você.
          STATUS=ok
          if [ -z "$EMAIL_DESTINO" ]; then
            echo "ERRO: o segredo EMAIL_DESTINO está vazio. Nada foi enviado para a Regina."
            STATUS=sem_destino
          elif ! enviar "$EMAIL_DESTINO" "$ASSUNTO" "$DATA" "$LINK_REAL"; then
            echo "ERRO: o envio para a Regina falhou."
            STATUS=falhou
          fi

          if [ -n "$EMAIL_TESTE" ]; then
            case "$STATUS" in
              ok)          AVISO="✅ Automação OK: $ASSUNTO enviada à Regina"; DATA_AVISO="$DATA (cópia de aviso para você, o link abre em modo teste)";;
              sem_destino) AVISO="❌ ATENÇÃO: a Regina NÃO recebeu a $ASSUNTO"; DATA_AVISO="$DATA (segredo EMAIL_DESTINO vazio no GitHub)";;
              *)           AVISO="❌ ATENÇÃO: o envio da $ASSUNTO para a Regina FALHOU"; DATA_AVISO="$DATA (veja o log da execução no GitHub)";;
            esac
            enviar "$EMAIL_TESTE" "$AVISO" "$DATA_AVISO" "$LINK_TESTE" || echo "Aviso: a cópia para você não saiu."
          fi

          [ "$STATUS" = "ok" ] || exit 1
          echo "E-mail \"$ASSUNTO\" enviado para a Regina."

      # O GitHub desliga agendamentos de repositório público depois de 60 dias sem atividade.
      # Se o último commit tiver 45 dias ou mais, faz um commit vazio para manter o e-mail funcionando.
      - uses: actions/checkout@v4
      - name: Manter o agendamento ativo
        run: |
          DIAS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Último commit há $DIAS dias."
          if [ "$DIAS" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantém o e-mail automático ativo"
            git push
          fi

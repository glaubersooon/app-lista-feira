function textoZap(){return `*LISTA* ${dataTxt}\n\n`+listas.filter(l=>!l.min).map(l=>{const at=l.itens.filter(i=>!i.off);return `*Lista ${l.nome}*\n${at.map(i=>'• '+linha(i)).join('\n')||'Nenhum item marcado'}`}).join('\n\n')}
function nomePDF(){const nomes=listas.filter(l=>!l.min).map(l=>l.nome);const dia=d.toLocaleDateString('pt-BR',{weekday:'long'}).replace('-feira','').replace(/^./,c=>c.toUpperCase());const dt=d.toLocaleDateString('pt-BR').replace(/\//g,'-');return `Lista ${nomes.join(' e ')} ${dia} - ${dt}.pdf`}


let abrindo=null,busca=null,addAberto=null,addTexto='',alertaDup=null,confirmaTudo=null,previaAberta=false;
let buscaListaId=null,buscaListaTexto='',novaListaAberta=false,novaListaTexto='',confirmaExcluir=null,menuAlvo=null,lixFiltro='todos';

const d=new Date();
const dataTxt=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}).replace(/^./,c=>c.toUpperCase());
$('#data').textContent=dataTxt;

function contar(l){const a=l.itens.filter(i=>!i.off).length;return l.itens.length?`${a} de ${l.itens.length} para comprar`:'sem itens'}
function itemHTML(i){return `<li class="item${i.off?' off':''}${editandoIds.has(i.id)?' editando':''}" data-id="${i.id}">
  <button class="ck" aria-label="${i.off?'Marcar para comprar':'Não comprar'}">${i.off?'✕':'✓'}</button>
  <button class="emo${i.e?'':' sem'}" data-emo aria-label="Trocar emoji">${i.e?ico(i.e):'☺'}</button><span class="nome">${esc(i.n)}</span>
  <button class="det${i.det?'':' vazio-d'}" data-det aria-label="Detalhe do item">${i.det?esc(i.det):'detalhe'}</button></li>`}
function addHTML(l){
  if(addAberto!==l.id)return `<div class="add-caixa"><button class="add-linha" data-add-abrir>＋ Adicionar item</button></div>`;
  let al='';
  if(alertaDup&&alertaDup.lista===l.id){const nomes=alertaDup.parecidos.map(p=>`<b>${esc(semEmoji(p.i.n))}</b> ${p.l.id===l.id?'nesta lista':'em '+esc(p.l.nome)}`).join(', ');
    al=`<div class="alerta" role="alert"><div>Já existe um item igual ou parecido: ${nomes}.<br>Tem certeza que deseja repetir <b>${esc(addTexto)}</b> nesta lista?</div><div class="acoes"><button data-dup-cancel>Cancelar</button><button data-dup-usar>Usar o que já existe</button>${alertaDup.parecidos.some(p=>p.l.id!==l.id)?'<button data-dup-mover>Mover para esta lista</button>':''}<button data-dup-sim style="font-weight:700">Sim, adicionar mesmo assim</button></div></div>`}
  return `<div class="add-caixa"><form class="add-form" data-form><input id="novo-${l.id}" value="${esc(addTexto)}" placeholder="Digite o produto" autocomplete="off" aria-label="Nome do novo item"><button>＋ Adicionar</button></form><div data-sug></div>${al}</div>`}
function sugestHTML(t){const q=norm(t);if(!q)return '';const achados=[];escopo().forEach(x=>x.itens.forEach(i=>{if(norm(i.n).includes(q)||parecido(i.n,t))achados.push({i,l:x})}));
  if(!achados.length)return '';
  return `<div class="sugest"><div class="sugest-tit">Já existem:</div>${achados.slice(0,6).map(a=>`<button type="button" data-sug="${a.i.id}"><span>${ico(a.i.e)} ${esc(a.i.n)}</span><small>${a.l.id===addAberto?'nesta lista':'em '+esc(a.l.nome)}${a.i.off?' · não marcado':''}</small></button>`).join('')}</div>`}
function tudoHTML(l){
  const conf=confirmaTudo===l.id?`<div class="alerta" role="alert" style="margin:10px 16px 0"><div><b>Tem certeza?</b><br>Se todos os itens forem marcados de uma vez, a organização atual será perdida.</div><div class="acoes"><button data-tudo-cancel>Cancelar e manter como está</button><button data-tudo-sim style="font-weight:700">Sim, marcar todos</button></div></div>`:'';
  const buscaAtiva=buscaListaId===l.id;
  const campoBusca=buscaAtiva?`<div class="bg-campo" style="margin:8px 16px 0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg><input id="buscaLista-${l.id}" value="${esc(buscaListaTexto)}" placeholder="Digite o produto" autocomplete="off" aria-label="Buscar nesta lista"><button type="button" data-busca-lista-fechar="${l.id}">✕ Fechar</button></div>`:'';
  return `<div class="sub"><button data-tudo>${l.tudo?'☑ Desmarcar tudo':'☐ Marcar tudo'}</button><button data-org>⇅ Organizar lista</button><button data-busca-lista="${l.id}" aria-pressed="${buscaAtiva}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg> Buscar nessa lista</button></div>${campoBusca}${conf}`}

function render(){
  const g=$('#grade');const y0=scrollY;g.style.minHeight=g.offsetHeight+'px';g.innerHTML='';const cards=[];
  listas.forEach(l=>{
    const q=document.createElement('section');
    q.className='quadro'+(l.min?' min':'');q.dataset.lista=l.id;
    q.style.setProperty('--cor',`var(--${l.cor})`);q.style.setProperty('--cor-bg',`var(--${l.cor}-bg)`);
    q.innerHTML=`<div class="quadro-topo">
      <h2>${esc(l.nome)}</h2><span class="conta">${contar(l)}</span>${l.min?'<span class="fora">fora da impressão</span>':''}
      <div class="topo-dir"><button class="tog" data-min><span class="chev" aria-hidden="true">▾</span>${l.min?'Ativar lista':'Desativar lista'}</button>${l.fixa?'':'<button class="xlista" data-xlista aria-label="Excluir lista" title="Excluir lista">✕</button>'}</div></div>
      ${confirmaExcluir===l.id?'<div class="alerta" role="alert" style="margin:10px 16px"><div><b>Tem certeza de que deseja excluir esta lista?</b><br>Os itens dela vão para a Lixeira.</div><div class="acoes"><button data-xlista-cancel>Cancelar</button><button data-xlista-sim style="font-weight:700">Sim, excluir</button></div></div>':''}
      ${l.min?'':`<div class="corpo">${tudoHTML(l)}${addHTML(l)}
      ${mostrarDica()&&l.itens.length>1?'<div class="dica-arrastar">✋ Segure um item e arraste para mudar a ordem</div>':''}
      <ul class="itens" data-ul="${l.id}">${l.itens.map(itemHTML).join('')}</ul>
      ${l.itens.length?'':'<div class="vazio" style="margin:0 16px 16px">Arraste itens para cá ou toque em Adicionar item</div>'}</div>`}`;
    cards.push(q);
  });
  const nb=document.createElement(novaListaAberta?'div':'button');nb.className='nova';
  if(novaListaAberta){nb.style.cssText='display:block;padding:16px';nb.innerHTML=`<form class="add-form" data-form-lista><input id="novaLista-nome" value="${esc(novaListaTexto)}" placeholder="Nome da nova lista" autocomplete="off" aria-label="Nome da nova lista"><button>＋ Criar</button></form>`}
  else{nb.dataset.novaAbrir='1';nb.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2" width="13" height="17" rx="3"/><path d="M6 7h6M6 10.5h6M6 14h3"/><circle cx="18" cy="18" r="5.5" fill="currentColor" stroke="none"/><path d="M18 15.2v5.6M15.2 18h5.6" style="stroke:var(--bg)" stroke-width="2"/></svg> Criar nova lista'}
  cards.push(nb);
  montar(g,cards);
  document.querySelectorAll('[data-ul]').forEach(ul=>Sortable.create(ul,{group:'listas',animation:180,ghostClass:'arrasto',fallbackClass:'arrasto-clone',delay:180,delayOnTouchOnly:true,forceFallback:true,fallbackTolerance:4,filter:'.ck,.det,.det-in,.emo,.nome-in',preventOnFilter:false,
    onStart:e=>{document.body.classList.add('arrastando');iniciaFlut(e.item);marcaEd(e.item.dataset.id)},
    onMove:e=>{document.querySelectorAll('.quadro').forEach(q=>q.classList.toggle('alvo',q.contains(e.to)))},
    onEnd:()=>{pararFlut();document.body.classList.remove('arrastando');document.querySelectorAll('.alvo').forEach(q=>q.classList.remove('alvo'));lerDOM();marcaEd(null);dicaVista();render()}}));
  if(addAberto){const inp=$('#novo-'+addAberto);if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);inp.closest('.add-caixa').querySelector('[data-sug]').innerHTML=alertaDup?'':sugestHTML(addTexto)}}
  if(novaListaAberta){const inp=$('#novaLista-nome');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}
  if(buscaListaId){const inp=$('#buscaLista-'+buscaListaId);if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}
  g.style.minHeight='';if(Math.abs(scrollY-y0)>1)scrollTo(0,y0);
  resumo();if(previaAberta)previa();aplicarBusca();aplicarBuscaLista();
  if(abrindo){const q=document.querySelector(`.quadro[data-lista="${abrindo}"]`),c=q&&q.querySelector('.corpo');abrindo=null;
    if(c&&!semMov()){q.classList.add('abrindo');c.style.overflow='hidden';const a=c.animate([{height:'0px',opacity:0},{height:c.offsetHeight+'px',opacity:1}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'});a.onfinish=()=>{c.style.overflow='';q.classList.remove('abrindo')}}}
  if(window.nuvem)nuvem.salvar();
}
const marcaEd=id=>{if(window.nuvem)nuvem.editando(id)};
const ocupado=()=>!!document.querySelector('.det-in,.nome-in')||document.body.classList.contains('arrastando');
function mostrarMsg(html){const g=$('#grade');g.innerHTML=`<div class="msg">${html}</div>`}
const semMov=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function aplicarBusca(){document.querySelectorAll('.item.achado').forEach(li=>li.classList.remove('achado'));if(busca===null)return;const q=norm(busca);if(!q){$('#bg-cont').textContent='';$('#bg-res').innerHTML='';return}
  const ach=[];listas.filter(l=>!l.min).forEach(l=>l.itens.forEach(i=>{if(norm(i.n).includes(q)){ach.push({i,l});const li=document.querySelector(`.item[data-id="${i.id}"]`);if(li)li.classList.add('achado')}}));
  $('#bg-cont').textContent=ach.length?`${ach.length} encontrado${ach.length>1?'s':''}`:'nada encontrado';
  $('#bg-res').innerHTML=ach.length?`<div class="sugest">${ach.map(a=>`<button type="button" data-ir="${a.i.id}"><span>${ico(a.i.e)} ${esc(a.i.n)}</span><small>em ${esc(a.l.nome)}${a.i.off?' · não marcado':''}</small></button>`).join('')}</div>`:''}
function aplicarBuscaLista(){document.querySelectorAll('.item.achado-lista').forEach(li=>li.classList.remove('achado-lista'));if(!buscaListaId||!buscaListaTexto)return;const q=norm(buscaListaTexto);if(!q)return;
  const l=listas.find(x=>x.id===buscaListaId);if(!l)return;
  l.itens.forEach(i=>{if(norm(i.n).includes(q)){const li=document.querySelector(`.item[data-id="${i.id}"]`);if(li)li.classList.add('achado-lista')}})}
function montar(g,cards){const n=Math.max(1,Math.floor((g.clientWidth+20)/380));const cols=[...Array(n)].map(()=>{const c=document.createElement('div');c.className='col';g.appendChild(c);return c});
  let ult=0;cards.forEach(c=>{let k=ult;for(let j=ult;j<n;j++)if(cols[j].offsetHeight<cols[k].offsetHeight)k=j;cols[k].appendChild(c);ult=k})}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const g=$('#grade');if(Math.max(1,Math.floor((g.clientWidth+20)/380))!==g.children.length&&!document.body.classList.contains('arrastando'))render()},200)});
let flut=null,px=0,py=0;
const pos=e=>{const p=e.touches?e.touches[0]:e;if(p){px=p.clientX;py=p.clientY}if(flut)moverFlut()};
['pointermove','mousemove','touchmove','pointerdown','touchstart'].forEach(t=>document.addEventListener(t,pos,{passive:true,capture:true}));
function iniciaFlut(el){pararFlut();const r=el.getBoundingClientRect(),z=pref.z||1;flut=el.cloneNode(true);flut.classList.remove('arrasto','sortable-chosen','flash','editando','achado');flut.classList.add('flutua');flut.style.width=r.width/z+'px';document.body.appendChild(flut);moverFlut()}
function moverFlut(){const z=pref.z||1;flut.style.left=(px/z-28)+'px';flut.style.top=(py/z-flut.offsetHeight/2)+'px'}
function pararFlut(){if(flut){flut.remove();flut=null}}
function lerDOM(){const todos={};listas.forEach(l=>l.itens.forEach(i=>todos[i.id]=i));
  document.querySelectorAll('[data-ul]').forEach(ul=>{const l=listas.find(x=>x.id===ul.dataset.ul);if(l)l.itens=[...ul.children].map(li=>todos[li.dataset.id]).filter(Boolean)})}
function resumo(){const inc=listas.filter(l=>!l.min).map(l=>l.nome);
  $('#vai').innerHTML=inc.length?`Vai sair na impressão: <b>${inc.map(esc).join(' e ')}</b>`:'Nenhuma lista ativa para imprimir'}
function previa(){const p=$('#previa');const inc=listas.filter(l=>!l.min);
  p.innerHTML=`<div class="previa-topo"><b>Assim vai sair na impressão</b><span class="data">${dataTxt}</span><button data-fechar-previa>Fechar</button></div>`+
    (inc.length?inc.map(l=>{const at=l.itens.filter(i=>!i.off);return `<div><h3>Lista ${esc(l.nome)}</h3>${at.length?`<ul>${at.map(i=>`<li>${esc(linha(i))}</li>`).join('')}</ul>`:'<span class="data">Nenhum item marcado</span>'}</div>`}).join(''):'<span class="data">Nenhuma lista ativa.</span>');
  p.hidden=false}
const FOLHA={w:794,h:1123,mv:57,mh:64,gap:40};
function folha(){const inc=listas.filter(l=>!l.min);
  const blocos=inc.map(l=>{const at=l.itens.filter(i=>!i.off);return `<div class="bloco"><h2>Lista ${esc(l.nome)}</h2><ul data-fl="${l.id}">${at.map(i=>`<li data-id="${i.id}"><span>${esc(linha(i))}</span><button class="fx" data-fx aria-label="Tirar da impressão">✕</button></li>`).join('')||'<li>Nenhum item marcado</li>'}</ul></div>`});
  const cab=`<h1>Lista ${inc.map(l=>esc(l.nome)).join(' e ')}</h1><div class="fdata">${dataTxt}</div>`;
  const util=FOLHA.w-2*FOLHA.mh,colW=(util-FOLHA.gap)/2,altura=FOLHA.h-2*FOLHA.mv;
  const med=document.createElement('div');med.className='folha';med.style.cssText=`position:absolute;left:-9999px;top:0;visibility:hidden;height:auto;padding:0;width:${util}px`;document.body.appendChild(med);
  const medir=(html,w)=>{med.style.width=w+'px';med.innerHTML=html;return med.offsetHeight};
  const hCab=medir(cab,util),hCheia=blocos.map(b=>medir(b,util)),hCol=blocos.map(b=>medir(b,colW));med.remove();
  let paginas;
  if(hCab+hCheia.reduce((a,b)=>a+b,0)<=altura){paginas=[{cols:[blocos.map((_,k)=>k)],unica:true}]}
  else{paginas=[];let pg=null,c=0,usado=0;
    blocos.forEach((_,k)=>{
      const lim=()=>altura-(paginas.length===1?hCab:0);
      if(!pg){pg={cols:[[],[]]};paginas.push(pg);c=0;usado=0}
      if(usado+hCol[k]>lim()&&pg.cols[c].length){if(c===0){c=1;usado=0}else{pg={cols:[[],[]]};paginas.push(pg);c=0;usado=0}}
      pg.cols[c].push(k);usado+=hCol[k]})}
  const o=$('#impr');
  o.innerHTML=`<div class="impr-barra"><button data-fechar-impr>← Voltar</button><span>Folha A4, como vai sair no papel${paginas.length>1?` (${paginas.length} páginas)`:''}</span><button class="principal so-pc" data-imprimir>🖨 Imprimir agora</button><button class="principal so-cel" data-pdf>📄 Salvar e compartilhar PDF</button></div>`+
    paginas.map((p,n)=>`<div class="folha-caixa"><div class="folha">${n===0?cab:''}${p.unica?p.cols[0].map(k=>blocos[k]).join(''):`<div class="duas">${p.cols.map(col=>`<div class="coluna">${col.map(k=>blocos[k]).join('')}</div>`).join('')}</div>`}</div></div>`).join('');
  o.hidden=false;escala();
  o.querySelectorAll('ul[data-fl]').forEach(ul=>Sortable.create(ul,{group:'fl-'+ul.dataset.fl,animation:180,ghostClass:'arrasto',fallbackClass:'arrasto-clone',onStart:e=>iniciaFlut(e.item),delay:180,delayOnTouchOnly:true,forceFallback:true,fallbackTolerance:4,filter:'.fx',preventOnFilter:false,onEnd:()=>{pararFlut();reordenar(ul.dataset.fl,[...ul.children].map(li=>li.dataset.id));render();folha()}}))}
function reordenar(lid,ids){const l=listas.find(x=>x.id===lid);const fila=ids.map(id=>l.itens.find(i=>i.id===id));l.itens=l.itens.map(i=>i.off?i:fila.shift())}

// PDF no celular: desenha cada folha A4 como imagem, junta num PDF e abre o compartilhar.
let pdfBlob=null,pdfNome='';
function carregar(src){return new Promise((ok,err)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=err;document.head.appendChild(s)})}
async function gerarPDF(b){const txt=b.innerHTML;b.disabled=true;b.textContent='Gerando PDF...';let cx;
  try{
    if(!window.html2canvas)await carregar('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf)await carregar('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const aberta=!$('#impr').hidden;folha();
    cx=document.createElement('div');cx.style.cssText='position:fixed;left:-10000px;top:0';document.body.appendChild(cx);
    const pags=[...$('#impr').querySelectorAll('.folha')].map(f=>{const c=f.cloneNode(true);c.style.transform='none';c.querySelectorAll('.fx').forEach(x=>x.remove());cx.appendChild(c);return c});
    if(!aberta)$('#impr').hidden=true;
    document.body.style.zoom='';await document.fonts.ready;
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});pdfNome=nomePDF();pdf.setProperties({title:pdfNome.replace(/\.pdf$/,'')});
    for(let k=0;k<pags.length;k++){const cv=await html2canvas(pags[k],{scale:2,backgroundColor:'#ffffff'});if(k)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297)}
    pdfBlob=pdf.output('blob');await compartilharPDF(true)}
  catch(e){console.error(e);aviso('Não foi possível gerar o PDF. Confira a internet e tente de novo.')}
  finally{if(cx)cx.remove();document.body.style.zoom=pref.z;b.disabled=false;b.innerHTML=txt}}
async function compartilharPDF(primeira){const f=new File([pdfBlob],pdfNome,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:pdfNome.replace(/\.pdf$/,'')});$('#modal').hidden=true;return}
    catch(e){if(e.name==='AbortError')return;if(!primeira){baixarPDF();return}}
    const m=$('#modal');m.innerHTML=`<div class="caixa-modal" role="dialog" aria-label="PDF pronto"><div class="modal-topo"><b>PDF pronto</b><button data-modal-fechar>✕ Fechar</button></div><span>${esc(pdfNome)}</span><button class="principal" data-pdf-share>📤 Compartilhar PDF</button><button data-pdf-baixar>⬇ Baixar PDF</button></div>`;m.hidden=false;return}
  baixarPDF()}
function baixarPDF(){const a=document.createElement('a');a.href=URL.createObjectURL(pdfBlob);a.download=pdfNome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);$('#modal').hidden=true;aviso('PDF salvo em Downloads.')}
function escala(){if($('#impr').hidden)return;document.querySelectorAll('.folha-caixa').forEach(c=>{const s=Math.min(1,c.clientWidth/794);c.querySelector('.folha').style.transform=`scale(${s})`;c.style.height=1123*s+'px'})}
addEventListener('resize',escala);

  document.body.appendChild(m);const z=pref.z||1;m.style.left=Math.max(8,Math.min(x/z,innerWidth/z-m.offsetWidth-8))+'px';m.style.top=Math.max(8,Math.min(y/z,innerHeight/z-m.offsetHeight-8))+'px'}

function excluirItem(id){const r=acharItem(id);if(!r)return;r.l.itens=r.l.itens.filter(i=>i!==r.i);Object.assign(r.i,{del:true,delEm:Date.now(),delLista:r.l.id,delListaNome:r.l.nome});lixeira.unshift(r.i);r.l.tudo=false;render();aviso(`${semEmoji(r.i.n)} foi para a Lixeira.`)}
function recuperar(id){const k=lixeira.findIndex(i=>i.id===id);if(k<0)return;const i=lixeira.splice(k,1)[0];let l=listas.find(x=>x.id===i.delLista);const sumiu=!l;if(!l)l=listas.find(x=>x.id==='feira')||listas[0];
  ['del','delEm','delLista','delListaNome'].forEach(c=>delete i[c]);l.itens.unshift(i);l.tudo=false;render();pintarLixeira();aviso(`${semEmoji(i.n)} voltou para ${l.nome}.`+(sumiu?' A lista original não existe mais.':''))}
function pintarLixeira(){const m=$('#modal');const nomes=new Map(listas.map(l=>[l.id,l.nome]));lixeira.forEach(i=>{if(!nomes.has(i.delLista))nomes.set(i.delLista,i.delListaNome||'Lista excluída')});

  m.innerHTML=`<div class="caixa-modal" role="dialog" aria-label="Lixeira"><div class="modal-topo"><b>🗑 Lixeira</b><button data-modal-fechar>✕ Fechar</button></div>
  <div class="cats-mercado"><button data-lixf="todos" class="${lixFiltro==='todos'?'on':''}">Todos</button>${[...nomes].map(([id,n])=>`<button data-lixf="${esc(id)}" class="${lixFiltro===id?'on':''}">${esc(n)}</button>`).join('')}</div>
  ${vis.length?`<div class="sugest">${vis.map(i=>`<div class="lix-linha"><span>${ico(i.e)} ${esc(i.n)} <small>de ${esc(i.delListaNome||'')}</small></span><button data-recuperar="${i.id}">↩ Recuperar</button></div>`).join('')}</div>`:'<div class="vazio">Nada na lixeira.</div>'}</div>`;m.hidden=false}
const quando=t=>{const d=t&&t.toDate?t.toDate():new Date(t||Date.now());return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
function pedirRestaurar(){const m=$('#modal');const f=finalizada;
  m.innerHTML=`<div class="caixa-modal" role="dialog" aria-label="Restaurar"><div class="modal-topo"><b>↻ Restaurar</b><button data-modal-fechar>✕ Fechar</button></div>`+
  (f?`<div>Voltar para a última versão finalizada, de <b>${quando(f.em)}</b>?<br><br>A ordem, os itens marcados e as listas ativas voltam como estavam. Itens adicionados depois continuam, no topo da lista.</div><div class="alerta" style="border:0;padding:0;background:none"><div class="acoes"><button data-modal-fechar>Cancelar</button><button data-restaurar-sim style="font-weight:700">Sim, restaurar</button></div></div>`
  :'<div>Ainda não existe versão finalizada. Ela é gravada quando você imprime, gera o PDF ou envia pelo WhatsApp.</div>')+'</div>';m.hidden=false}
function restaurar(){const f=finalizada;if(!f)return;const todos={};listas.forEach(l=>l.itens.forEach(i=>todos[i.id]=i));const destino={};
  listas.forEach(l=>{const s=f.listas&&f.listas[l.id];if(s)l.min=!!s.min;l.tudo=false;destino[l.id]=[]});
  const usados=new Set();Object.entries(f.itens||{}).sort((a,b)=>a[1].pos-b[1].pos).forEach(([id,s])=>{const i=todos[id];if(!i||!destino[s.lista])return;i.off=!!s.off;destino[s.lista].push(i);usados.add(id)});
  listas.forEach(l=>{l.itens=[...l.itens.filter(i=>!usados.has(i.id)),...destino[l.id]]});$('#modal').hidden=true;render();aviso('Lista restaurada.')}
function estadoAtual(){const L={},I={};listas.forEach((l,li)=>{L[l.id]={min:!!l.min,pos:li};l.itens.forEach((i,ii)=>I[i.id]={lista:l.id,pos:ii,off:!!i.off})});return {listas:L,itens:I}}
function finalizar(){if(window.nuvem)nuvem.finalizar(estadoAtual())}

  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();salvar(true)}if(e.key==='Escape'){e.stopPropagation();salvar(false)}});

<!--
  Este arquivo NÃO é usado pelo site nem pelo workflow do GitHub Actions.
  Ele existe só como referência: o texto abaixo (a partir de <!doctype html>)
  deve ser colado no editor de template do EmailJS (template_bbidvdd),
  na aba "Code Editor" / HTML do template — é lá que o layout do e-mail
  realmente mora, fora deste repositório.

  Variáveis usadas (já enviadas pelo workflow .github/workflows/email.yml):
    {{assunto}} — título da lista (ex.: "Lista Sr. Jorge" ou "Lista Feira")
    {{data}}    — dia por extenso + data (ex.: "Sexta-feira, 03/10")
    {{link}}    — link de acesso à lista
  No próprio EmailJS, configure também:
    - Campo "To Email"  = {{para}}
    - Campo "Subject"   = {{assunto}}
-->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{assunto}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(20,30,20,.06);">
        <tr><td style="background:#3f9a5c;height:8px;line-height:8px;font-size:0;">&nbsp;</td></tr>
        <tr><td style="padding:28px 32px 20px;">
          <div style="font:700 12px/1.4 Arial,sans-serif;letter-spacing:.06em;color:#3f9a5c;text-transform:uppercase;">{{data}}</div>
          <div style="font:700 22px/1.3 Arial,sans-serif;color:#1c201e;margin-top:10px;">{{assunto}}</div>
        </td></tr>
        <tr><td style="border-top:1px solid #edf0ee;font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td style="padding:24px 32px 8px;font:15px/1.6 Arial,sans-serif;color:#3c4440;">
          Bom dia!<br><br>Clique no botão abaixo para abrir e editar a lista de hoje.
        </td></tr>
        <!-- Ícone dentro do próprio botão, à esquerda do texto: mais simples e que não desalinha
             em clientes de e-mail que ignoram margem negativa (Outlook, apps do Terra etc.). -->
        <tr><td align="center" style="padding:22px 32px;">
          <a href="{{link}}" style="display:inline-block;background:#3f9a5c;color:#ffffff;text-decoration:none;font:700 16px/1 Arial,sans-serif;padding:16px 28px;border-radius:12px;"><img src="https://glaubersooon.github.io/app-lista-feira/icone-192.png" width="18" height="18" alt="" style="vertical-align:middle;border-radius:4px;margin-right:8px;">Abrir Lista</a>
        </td></tr>
        <tr><td style="padding:0 32px 28px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;border-radius:12px;">
            <tr><td align="center" style="padding:16px;font:14px/1.6 Arial,sans-serif;color:#6b7178;">
              O botão acima não funcionou?<br>
              <a href="{{link}}" style="color:#3f9a5c;font-weight:700;text-decoration:underline;">Toque aqui para acessar pelo navegador</a>
            </td></tr>
          </table>
        </td></tr>
        <tr><td style="border-top:1px solid #edf0ee;padding:18px 32px;text-align:center;font:12px/1.6 Arial,sans-serif;color:#a6acb2;">
          Lembrete automático enviado pelo app Lista de Compras.<br>Este link é pessoal — não compartilhe.
          <br><a href="{{link}}" style="color:#c6ccd2;text-decoration:underline;font-size:11px;">teste</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
